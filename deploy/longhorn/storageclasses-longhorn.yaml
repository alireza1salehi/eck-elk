apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-hot
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  diskSelector: "hot"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-warm
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  diskSelector: "warm"
